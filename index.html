er;justify-content:center;padding:16px;backdrop-filter:blur(4px)}.modalshade.show{display:flex}.modal{background:#fff7e4;width:min(100%,440px);border:4px solid #d9c79e;border-radius:22px;box-shadow:0 9px 0 #907a54,0 25px 65px #122b2390;padding:24px;color:#374d3b;max-height:calc(100dvh - 60px);overflow:auto}.modal h2{margin:0 0 12px;font-size:25px;color:#314935}.modal p,.modal li{line-height:1.7;font-size:14px}.modal ul{padding-left:20px}.modal button{width:100%;border:0;background:#45805b;color:#fffbea;font-size:16px;font-weight:900;border-bottom:4px solid #315b45;border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}.modal .secondary{background:#efe5cf;color:#6b644f;border-bottom-color:#d4c5a7}.modal .kicker{font-size:11px;font-weight:950;letter-spacing:.16em;color:#a48443;margin-bottom:7px}.modal .stat{padding:10px;border-radius:11px;background:#eee8d1;font-weight:850;color:#6b6446;margin:12px 0}.minimap{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:17px;display:none}.joy-guide{position:absolute;left:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:90px;height:90px;border:2px dashed #f5ffed44;background:#365d4044;border-radius:100%;display:grid;place-items:center;color:#f8ffe993;font-size:10px;font-weight:900}.joy-guide:after{content:'✣';font-size:26px;position:absolute;color:#eafbe993}button:focus-visible{outline:3px solid #d2a64d}@media(min-width:760px){.mission{top:113px;left:21px}.tools{top:20px;right:20px;flex-direction:row}.phase{margin-right:152px}.joy-guide{display:none}.foot{bottom:20px}}@media(max-height:620px){.mission{top:90px;max-width:225px}.tools{top:90px}.foot{bottom:10px}}

<body>
<canvas id="field" aria-label="游戏地图；在屏幕任意空白处拖动以移动领主。电脑可用 WASD 或方向键。"></canvas>
<div id="bootNotice" role="status" style="position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,350px);padding:19px 20px;background:#fff8e8;color:#334d3d;border:3px solid #c3a36d;border-radius:18px;box-shadow:0 10px 40px #243e3080;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;text-align:center;line-height:1.7"><b style="font-size:18px">🏰 奔奔王国</b><p style="margin:8px 0">正在载入游戏…</p><small>如果始终停留在这里，说明当前预览器不执行网页脚本。请用真正的浏览器打开，iPhone 推荐直接使用在线试玩链接，而不是「文件」App 的预览。</small></div>
<div class="hud"><div class="top"><div class="lefttop"><div class="currency"><span class="coin">$</span><span id="gold">65</span><span style="font-size:12px;color:#e9d4a2;align-self:end;margin-bottom:2px">金币</span></div><div class="subhud" id="levelText">🏰 王国 Lv.1 · 已建 0 / 8</div></div><div class="righttop"><div class="phase" id="phase">☀️ 白昼 · 第 1 天<br><b>准备中</b></div><div class="hp">🏰 城堡 <span id="hp">100 / 100</span><div class="bar"><div id="hpbar"></div></div></div></div></div><div class="mission" id="mission"><div class="step">🏁 当前任务</div><b id="taskTitle">走向发光的建筑地基</b><p id="taskDesc">拖动屏幕移动，金币够了靠近后会自动建造。</p></div><div class="tools"><button class="tool" id="help" title="玩法说明" aria-label="玩法说明">?</button><button class="tool" id="pause" title="暂停" aria-label="暂停">Ⅱ</button><button class="tool" id="reset" title="重新开始" aria-label="重新开始">↻</button></div><div class="joy-guide" id="joyGuide">拖动移动</div><div class="toast" id="toast"></div><div class="foot" id="footer">🕹️ 拖动屏幕移动 · 靠近金币和地基自动交互</div></div>

<script>
'use strict';
(()=>{
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);let CW=0,CH=0,DPR=1,scale=1,camX=0,camY=0;
if(!ctx)throw new Error('当前预览器不支持 Canvas 2D');
if(typeof ctx.roundRect!=='function'){ctx.roundRect=function(x,y,w,h,r){const rr=Math.max(0,Math.min(typeof r==='number'?r:12,Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+rr,y);this.lineTo(x+w-rr,y);this.quadraticCurveTo(x+w,y,x+w,y+rr);this.lineTo(x+w,y+h-rr);this.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);this.lineTo(x+rr,y+h);this.quadraticCurveTo(x,y+h,x,y+h-rr);this.lineTo(x,y+rr);this.quadraticCurveTo(x,y,x+rr,y);return this;};}
const WORLD={w:1450,h:1360},SAVEKEY='benben_roaming_offline_v2_20261018';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const defs=[
{id:'lumber',name:'伐木场',icon:'🪵',x:405,y:555,cost:25,benefit:'持续产金币',desc:'工人每隔几秒运送木材'},
{id:'farm',name:'麦田',icon:'🌾',x:996,y:555,cost:30,benefit:'回复城堡',desc:'产粮补给与城堡修复'},
{id:'quarry',name:'采石场',icon:'🪨',x:417,y:847,cost:40,benefit:'更多掉落',desc:'派遣采石工生产金币'},
{id:'tower',name:'弓箭塔',icon:'🏹',x:1013,y:826,cost:55,benefit:'自动攻击',desc:'远程抵御叛军入侵'},
{id:'forge',name:'铁匠铺',icon:'⚒',x:704,y:299,cost:65,benefit:'领主伤害+',desc:'打磨武器，强化自动攻击'},
{id:'market',name:'集市',icon:'💰',x:1118,y:390,cost:85,benefit:'被动金币+',desc:'每天获得稳定金币'},
{id:'barracks',name:'兵营',icon:'🛡',x:1144,y:1054,cost:95,benefit:'招募守卫',desc:'训练卫兵保卫王国'},
{id:'wall',name:'城墙',icon:'🧱',x:717,y:1153,cost:110,benefit:'城堡抗伤+',desc:'增强防御，减少损伤'}
];
const baseBuild=()=>Object.fromEntries(defs.map(d=>[d.id,0]));
function initial(){return {version:2,gold:65,wave:1,wins:0,castle:100,castleMax:100,x:594,y:703,build:baseBuild(),phase:'day',phaseTime:30,session:0,kills:0,spent:0,lastSaved:Date.now()}};
let S=initial(),enemies=[],coins=[],projectiles=[],particles=[],floating=[],sprites=[],decor=[],state='play',currentModal='',holdId=null,holdProgress=0,needsExit=null,interactName='',paused=false,last=0,anim=0,accUI=0,accSave=0,coinTimer=0,spawnTimer=0,spawnRemaining=0,shootCd=0,waveBonus=false,tipTime=0,autoTarget=null,toastTime=0, pointer={active:false,id:null,startX:0,startY:0,x:0,y:0,screenX:0,screenY:0,moved:false},keys={},killFeed=0,shake=0;
const safeLoad=()=>{try{let raw=localStorage.getItem(SAVEKEY);if(!raw)return false;const val=JSON.parse(raw);if(val.version!==2||!val.build)return false;S={...initial(),...val,build:{...baseBuild(),...val.build},x:clamp(val.x,80,WORLD.w-80),y:clamp(val.y,80,WORLD.h-80),gold:clamp(Number(val.gold)||0,0,999999),castle:clamp(Number(val.castle)||40,5,500)};S.phase='day';S.phaseTime=27;S.lastSaved=Date.now();return true}catch{return false}};
const save=()=>{S.lastSaved=Date.now();try{localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch{}};
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');toastTime=2.15}
function modal(title,body,buttons){paused=true;currentModal='open';$('modal').innerHTML='<div class="kicker">BENBEN KINGDOM · OFFLINE</div><h2>'+title+'</h2>'+body+'<div id="modalBtns"></div>';buttons.forEach(({label,action,secondary})=>{let b=document.createElement('button');b.textContent=label;if(secondary)b.className='secondary';b.onclick=()=>{closeModal();action&&action()};$('modalBtns').appendChild(b)});$('shade').classList.add('show')}
function closeModal(){$('shade').classList.remove('show');currentModal='';paused=false;last=performance.now()}
function help(){modal('🕹️ 走到哪里，建到哪里','<p>这是以<strong>移动角色</strong>为唯一主要操作的离线小王国：没有建筑升级面板，也没有“迎击”按钮。</p><ul><li>📱 <b>手机：</b>在场景任意位置按住并拖动，领主就往拖动方向移动。</li><li>⌨️ <b>电脑：</b>WASD／方向键移动，鼠标按住拖动也可以。</li><li>💰 走过金币自动拾取；金币会从已有建筑附近产出。</li><li>🏗️ 走到发光地基附近，金币足够时停留约 0.7 秒便<strong>自动施工</strong>。想升级同一栋建筑，先离开再走近。</li><li>⚔️ 白天经营，晚上叛军进攻。领主和箭塔靠近敌人会自动攻击，兵营会生成卫兵。</li><li>💾 进度自动保存在这个浏览器里；清除浏览器数据可能丢失。</li></ul>',[{label:'开始漫游'}])}
function setTask(){const n=defs.filter(d=>S.build[d.id]).length;
let t='走向发光地基',d='拖动屏幕移动；靠近金币与建筑自动交互';
if(!n){t='建造你的第一座建筑';d='建议从左侧的伐木场（25 金币）开始'}
else if(!S.build.tower){t='准备防御 · 建造弓箭塔';d='向右下方移动，找到弓箭塔地基'}
else if(!S.build.market){t='扩张村庄 · 建造集市';d='收集建筑产出的金币，持续扩张'}
else if(n<defs.length){t='发展王国 · 已建 '+n+' / '+defs.length;d='强化防线，建设农场、兵营与铁匠铺'}
else{t='王国初具规模';d='继续升级建筑，冲击更高的守城波次'}
$('taskTitle').textContent=t;$('taskDesc').textContent=d;
$('levelText').textContent='🏰 王国 Lv.'+(1+Math.floor(n/3)+Math.floor((S.wins)/6))+' · 已建 '+n+' / '+defs.length;
}
function updateUI(){const n=Math.round(S.gold);$('gold').textContent=n.toLocaleString('zh-CN');$('hp').textContent=Math.max(0,Math.ceil(S.castle))+' / '+S.castleMax;$('hpbar').style.width=Math.round(100*S.castle/S.castleMax)+'%';$('phase').innerHTML=S.phase==='day'?'☀️ 白昼 · 第 '+S.wave+' 天<br><b>'+Math.ceil(S.phaseTime)+' 秒后入侵</b>':'🌙 叛军 · 第 '+S.wave+' 波<br><b>'+enemies.length+' 名敌军</b>';setTask();}
function dropCoin(x,y,val=3,scatter=35){coins.push({x:clamp(x+rand(-scatter,scatter),40,WORLD.w-40),y:clamp(y+rand(-scatter,scatter),40,WORLD.h-40),val,age:0,bob:rand(0,6.28)});if(coins.length>130)coins.splice(0,coins.length-130)}
function burst(x,y,color='#f9d46b',n=12){for(let i=0;i<n;i++){let a=rand(0,6.28),v=rand(30,135);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-45,ttl:rand(.35,.9),max:1,r:rand(2,5),color})}}
function label(x,y,text,color='#fff9dd'){floating.push({x,y,text,color,ttl:1.05})}
const buildCost=d=>Math.ceil(d.cost*Math.pow(1.68,S.build[d.id]));
const hero=()=>({x:S.x,y:S.y});
function localHint(){let best=null,dist=150;for(const d of defs){const l=distance(hero(),d);if(l<dist){best=d;dist=l}}return best}
function construct(d){const cost=buildCost(d);if(S.gold<cost){toast('金币不足，还差 '+(cost-Math.floor(S.gold))+' 💰');return}S.gold-=cost;S.spent+=cost;S.build[d.id]++;burst(d.x,d.y-60,'#fff0a7',25);burst(d.x,d.y-30,'#b4ffd3',14);label(d.x,d.y-80,(S.build[d.id]===1?'建成 ':'升级 ')+d.name+' Lv.'+S.build[d.id],'#fff5b9');toast('🔨 '+d.name+' Lv.'+S.build[d.id]+' 已完成！');save();updateUI();}
function initWorld(){const rr=Math.random;let seed=8182;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};decor=[];for(let i=0;i<270;i++){let x=40+rnd()*1370,y=42+rnd()*1280;const core=Math.hypot(x-715,y-730)<170,near=defs.some(d=>Math.hypot(x-d.x,y-d.y)<115);if(core||near)continue;let type=rnd();decor.push({x,y,t:type<.39?'tall':type<.51?'round':type<.76?'flower':type<.88?'rock':'bush',sz:rand(13,25)*(type<.51?1:0.52),seed:rnd()*6})}}
function startSave(){const loaded=safeLoad();initWorld();for(let i=0;i<13;i++)dropCoin(710+Math.cos(i*1.63)*rand(65,180),765+Math.sin(i*1.63)*rand(80,170),[2,3,4,6][i%4],12);if(loaded)toast('已恢复上次的王国');updateUI();if(!loaded)modal('👑 欢迎来到奔奔王国','<p>这次你<strong>不用点升级面板</strong>。</p><p>你就是地图里的蓝披风领主。用手指拖动他，<strong>走到发光的建筑地基旁，金币足够就会自动建造</strong>。</p><div class="stat">💰 开局 65 金币　·　⚒ 8 处建筑点　·　🌙 天黑敌军来袭</div><p>金币散落在地图和建筑附近，路过就能捡起；攻击由领主、箭塔和卫兵自动完成。</p>',[{label:'进入王国'}]);}
function resized(){CW=innerWidth;CH=innerHeight;DPR=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(CW*DPR));canvas.height=Math.max(1,Math.round(CH*DPR));const mobile=CW<700;scale=mobile?clamp(CW/570,.62,.94):clamp(Math.min(CW/1320,CH/930),.72,1.2);}
function worldToScreen(x,y){return {x:(x-camX)*scale+CW*.5,y:(y-camY)*scale+CH*.51}}
function screenToWorld(x,y){return{x:(x-CW*.5)/scale+camX,y:(y-CH*.51)/scale+camY}}
function startWave(){S.phase='night';enemies=[];waveBonus=false;spawnRemaining=3+Math.min(16,Math.round(S.wave*1.45));spawnTimer=.5;toast('⚔️ 第 '+S.wave+' 波叛军来袭！');}
function spawn(){let side=Math.floor(rand(0,4)),point;switch(side){case 0:point={x:rand(100,1300),y:60};break;case 1:point={x:rand(90,1350),y:1320};break;case 2:point={x:50,y:rand(100,1250)};break;default:point={x:1380,y:rand(100,1250)}}let elite=S.wave%5===0&&spawnRemaining===1;enemies.push({x:point.x,y:point.y,hp:(elite?110:22)+S.wave*(elite?24:7),maxHp:(elite?110:22)+S.wave*(elite?24:7),speed:(elite?24:34)+Math.min(16,S.wave*1.7),atk:elite?9:3,r:elite?25:15,type:elite?'boss':rand(0,1)<.25?'armored':'rebel',cool:1.3,flash:0,dead:false,id:Math.random()})}

function drawCoins(){for(const c of coins){let bob=Math.sin(anim*4+c.bob)*4;ellipse(c.x+3,c.y+5,13,7,'#466b414a');circle(c.x,c.y-6+bob,11,'#9c7238');circle(c.x,c.y-9+bob,10,'#f3c157');circle(c.x-2,c.y-12+bob,6,'#ffed96');text('◆',c.x,c.y-9+bob,8,'#c78b2f')}}
function overlay(){if(S.phase==='night'){ctx.fillStyle='#203a58';ctx.globalAlpha=.16;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.globalAlpha=1}
for(const p of projectiles){if(p.kind==='hit'){circle(p.x,p.y,16,'#ffdf7499');continue}ctx.strokeStyle=p.kind==='hero'?'#f5f2ba':p.kind==='tower'?'#ffe49c':'#e4d6b4';ctx.lineWidth=p.kind==='hero'?5:4;ctx.beginPath();ctx.moveTo(p.x-7,p.y+6);ctx.lineTo(p.x+6,p.y-6);ctx.stroke();circle(p.x,p.y,4,'#fff4c2')}
for(const p of particles){ctx.globalAlpha=clamp(p.ttl/.65,0,1);circle(p.x,p.y,p.r,p.color)}ctx.globalAlpha=1;
for(const f of floating){ctx.save();ctx.shadowColor='#35553c';ctx.shadowBlur=5;ctx.shadowOffsetY=2;ctx.globalAlpha=Math.min(1,f.ttl*2);text(f.text,f.x,f.y,19,f.color);ctx.restore()}
}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#78ad7c';ctx.fillRect(0,0,CW,CH);
const idealX=clamp(S.x, CW/(2*scale),WORLD.w-CW/(2*scale)),idealY=clamp(S.y,CH/(2*scale),WORLD.h-CH/(2*scale));camX=lerp(camX||idealX,idealX,.10);camY=lerp(camY||idealY,idealY,.10);
ctx.save();ctx.translate(CW*.5,CH*.51);ctx.scale(scale,scale);ctx.translate(-camX+(shake>0?rand(-3,3):0),-camY+(shake>0?rand(-3,3):0));terrain();
// Sort 2.5D entities by depth for convincing occlusion
let objects=decor.map(d=>({y:d.y,draw:()=>drawTree(d)}));objects.push({y:756,draw:()=>castle(711,748)});for(const d of defs)objects.push({y:d.y,draw:()=>drawPad(d)});for(const e of enemies)if(!e.dead)objects.push({y:e.y,draw:()=>drawEnemy(e)});objects.push({y:S.y,draw:drawHero});objects.sort((a,b)=>a.y-b.y);
drawCoins();for(const o of objects)o.draw();overlay();ctx.restore();drawJoystick();const boot=document.getElementById('bootNotice');if(boot)boot.style.display='none'}
function lerp(a,b,t){return a+(b-a)*t}
function drawJoystick(){if(!pointer.active)return;let x=pointer.startX,y=pointer.startY,dx=pointer.x-x,dy=pointer.y-y,d=Math.hypot(dx,dy),lim=54,r=d?Math.min(lim,d):0;ctx.save();ctx.globalAlpha=.88;circle(x,y,72,'#1e493b65');ctx.beginPath();ctx.strokeStyle='#fff9d7a0';ctx.lineWidth=2;ctx.arc(x,y,70,0,6.29);ctx.stroke();circle(x+dx/Math.max(1,d)*r,y+dy/Math.max(1,d)*r,29,'#fff4d1b8');circle(x+dx/Math.max(1,d)*r,y+dy/Math.max(1,d)*r,17,'#6ea57bc7');ctx.restore()}
let raf=null;function frame(ts){let dt=Math.min(.052,(ts-last)/1000||.016);last=ts;if(!paused)tick(dt);draw();raf=requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{if(paused)return;canvas.setPointerCapture(e.pointerId);pointer={active:true,id:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false};autoTarget=null;$('joyGuide').style.display='none';e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(pointer.active&&pointer.id===e.pointerId){pointer.x=e.clientX;pointer.y=e.clientY;e.preventDefault()}});
const release=e=>{if(!pointer.active||pointer.id!==e.pointerId)return;const prev=pointer;pointer.active=false;if(!prev.moved&&e.pointerType==='mouse'){autoTarget=screenToWorld(e.clientX,e.clientY)}};
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();keys[e.code]=true;autoTarget=null}if(e.code==='Escape'&&!currentModal)togglePause()});window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('blur',()=>{pointer.active=false;keys={};save()});document.addEventListener('visibilitychange',()=>{if(document.hidden){pointer.active=false;keys={};save()}});window.addEventListener('beforeunload',save);
function togglePause(){if(currentModal)return;modal('⏸️ 游戏已暂停','<p>你的王国、金币和建设进度都会自动保存。</p><div class="stat">当前第 '+S.wave+' 天 · 金币 '+Math.floor(S.gold)+' · 已消灭 '+S.kills+' 名叛军</div>',[{label:'继续漫游'}])}
$('pause').onclick=togglePause;$('help').onclick=help;$('reset').onclick=()=>modal('确定重建王国？','<p>这将删除当前进度，包括金币、建筑、城堡耐久和波次。操作无法撤销。</p>',[{label:'取消，保留王国',secondary:true},{label:'确认，重新开始',action:()=>{try{localStorage.removeItem(SAVEKEY)}catch{};S=initial();enemies=[];coins=[];projectiles=[];particles=[];floating=[];holdId=null;needsExit=null;coinTimer=0;spawnRemaining=0;startSave();}}]);
window.addEventListener('error',e=>{const boot=document.getElementById('bootNotice');if(boot){boot.style.display='block';boot.innerHTML='<b>游戏运行时遇到错误</b><p>请在 Safari 或 Chrome 中打开网页，勿使用文件预览器。</p>';}});window.addEventListener('resize',resized);resized();startSave();camX=S.x;camY=S.y;last=performance.now();raf=requestAnimationFrame(frame);
// Non-network diagnostic hooks for offline smoke tests.
window.__benbenDebug={snapshot:()=>JSON.parse(JSON.stringify(S)),move:(x,y)=>{S.x=x;S.y=y},addGold:n=>{S.gold+=n},tick:n=>{for(let i=0;i<n;i++)tick(.05)},build:d=>defs.find(v=>v.id===d),getEnemies:()=>enemies.length,getCoins:()=>coins.length,forceWave:()=>startWave(),save};
})();
</script>
